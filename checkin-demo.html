<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FP 모닝 브리핑 — 데모</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css?v=3.9">
  <style>
    .demo-banner {
      background: #FEF3F2;
      border-bottom: 2px solid #DC2626;
      color: #991B1B;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      padding: 8px 12px;
      position: sticky;
      top: 0;
      z-index: 1000;
      letter-spacing: -0.2px;
    }
    .demo-controls {
      background: white;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }
    .demo-controls h3 {
      font-size: 13px;
      color: var(--color-text-secondary);
      margin: 0 0 10px 0;
      letter-spacing: -0.2px;
    }
    .demo-empid-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .demo-empid-row input {
      flex: 1;
      padding: 10px 12px;
      border: 1.5px solid var(--color-border);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      letter-spacing: 2px;
    }
    .demo-empid-row button {
      padding: 10px 16px;
      background: var(--color-primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .demo-empid-row button:disabled {
      background: var(--color-text-muted);
      cursor: not-allowed;
    }
    .demo-scenarios {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .demo-scenario {
      padding: 8px 10px;
      border: 1.5px solid var(--color-border);
      border-radius: 8px;
      background: white;
      font-size: 12px;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      transition: all 0.15s;
      color: var(--color-text);
    }
    .demo-scenario.active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: white;
      font-weight: 700;
    }
    .demo-empinfo {
      font-size: 12px;
      color: var(--color-text-secondary);
      margin-top: 8px;
      padding: 6px 10px;
      background: var(--color-bg);
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="demo-banner">데모 모드 — 실제 출근 기록 저장 안 됨</div>

  <div class="checkin-page">

    <header class="checkin-header">
      <div class="brand">
        <span class="brand-dots">
          <span class="dot dot-1"></span>
          <span class="dot dot-2"></span>
          <span class="dot dot-3"></span>
        </span>
        <span class="brand-name">FP 모닝 브리핑</span>
      </div>
    </header>

    <main class="checkin-main">

      <!-- 데모 컨트롤 -->
      <div class="demo-controls">
        <h3>1) 시연할 사번 입력</h3>
        <div class="demo-empid-row">
          <input type="tel" id="demoEmpId" placeholder="0000000" maxlength="10" inputmode="numeric">
          <button id="demoLoadBtn" onclick="loadDemoEmp()">불러오기</button>
        </div>
        <div class="demo-empinfo" id="demoEmpInfo" style="display:none;"></div>

        <h3 style="margin-top:14px;">2) 시나리오 강제 (출근 누를 때 적용)</h3>
        <div class="demo-scenarios">
          <button class="demo-scenario active" data-sc="real" onclick="setScenario(this)">그대로 (진짜 상태)</button>
          <button class="demo-scenario" data-sc="month5" onclick="setScenario(this)">이번달 5일째 마일스톤</button>
          <button class="demo-scenario" data-sc="month10" onclick="setScenario(this)">이번달 10일째</button>
          <button class="demo-scenario" data-sc="month20huge" onclick="setScenario(this)">이번달 20일째 HUGE</button>
          <button class="demo-scenario" data-sc="streak3" onclick="setScenario(this)">연속 3일</button>
          <button class="demo-scenario" data-sc="streak7" onclick="setScenario(this)">연속 7일</button>
          <button class="demo-scenario" data-sc="streak30huge" onclick="setScenario(this)">연속 30일 HUGE</button>
          <button class="demo-scenario" data-sc="firstOfMonth" onclick="setScenario(this)">이번달 첫 출근</button>
          <button class="demo-scenario" data-sc="late" onclick="setScenario(this)">지각 (09:15)</button>
          <button class="demo-scenario" data-sc="newbie" onclick="setScenario(this)">신규 등록</button>
        </div>
      </div>

      <!-- 토큰 모드 동일 화면 (사번 로드 후 표시) -->
      <section id="tokenSection" class="screen" style="display:none;">
        <div class="greeting-block">
          <h1 class="greeting-name"><span id="tokenEmpName">홍길동</span> <span class="greeting-suffix">님</span></h1>
          <p class="greeting-empid" id="tokenEmpId">사번 0000000</p>
        </div>

        <div class="ai-greet-card">
          <span class="ai-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            오늘 한마디
          </span>
          <p class="ai-greet-text typing" id="tokenAiGreeting">&nbsp;</p>
        </div>

        <div class="progress-card" id="progressCard" style="display:none;">
          <div class="progress-header">
            <span class="progress-title">이번달 출근</span>
            <span class="progress-count"><span id="progressCurrent">0</span> / <span id="progressTotal">22</span></span>
          </div>
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progressBarFill" style="width:0%;"></div>
          </div>
          <div class="progress-next" id="progressNext">·</div>
        </div>

        <div class="streak-card" id="streakCard" style="display:none;">
          <div class="streak-icon" id="streakIcon">·</div>
          <div class="streak-body">
            <div class="streak-headline" id="streakHeadline">·</div>
            <div class="streak-sub" id="streakSub">·</div>
          </div>
        </div>

        <div class="weekly-card">
          <div class="weekly-header">
            <span class="weekly-title">이번 주 출근</span>
            <span class="weekly-count" id="weeklyCount">- / 5</span>
          </div>
          <div class="weekly-days" id="weeklyDays"></div>
        </div>

        <div class="event-grid event-grid-compact">
          <button class="event-btn event-primary" data-event="출근" onclick="demoEventCheckin('출근')">
            <span class="event-name">출근</span>
            <span class="event-state" id="state-출근">&nbsp;</span>
          </button>
          <button class="event-btn" data-event="귀소" onclick="demoEventCheckin('귀소')">
            <span class="event-name">귀소</span>
            <span class="event-state" id="state-귀소">&nbsp;</span>
          </button>
          <button class="event-btn" data-event="학습회" onclick="demoEventCheckin('학습회')">
            <span class="event-name">학습회</span>
            <span class="event-state" id="state-학습회">&nbsp;</span>
          </button>
          <button class="event-btn" data-event="퇴근" onclick="demoEventCheckin('퇴근')">
            <span class="event-name">퇴근</span>
            <span class="event-state" id="state-퇴근">&nbsp;</span>
          </button>
        </div>
      </section>

      <!-- 로딩 -->
      <section id="loadingSection" class="screen" style="display:none;">
        <div class="loading-card">
          <div class="spinner show"></div>
          <p>처리 중이에요…</p>
        </div>
      </section>

      <!-- 성공 결과 -->
      <section id="successSection" class="result">
        <div class="result-card">
          <div class="result-icon-circle">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
          <h2 class="result-message">출근 확인되었습니다</h2>
          <div class="result-time" id="resultTime">08:42</div>
          <div class="result-detail" id="resultDetail"></div>

          <div class="ai-greet-card result-greet">
            <span class="ai-badge">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
              오늘 한마디
            </span>
            <p class="ai-greet-text typing" id="resultGreeting">&nbsp;</p>
          </div>

          <button class="btn btn-secondary btn-block" onclick="resetDemo()" style="margin-top:24px;">다시 시연하기</button>
        </div>
      </section>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script>window.__SKIP_AUTO_INIT = true;</script>
  <script src="js/config.js?v=3.9"></script>
  <script src="js/checkin.js?v=3.9"></script>
  <script src="js/checkin-demo.js?v=3.9"></script>
</body>
</html>
