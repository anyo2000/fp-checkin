<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FP 모닝 브리핑 — 데모</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css?v=4.4">
  <style>
    .demo-banner {
      background: #FEF3F2;
      border-bottom: 2px solid #DC2626;
      color: #991B1B;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      padding: 8px 12px;
      position: sticky;
      top: 0;
      z-index: 1000;
      letter-spacing: -0.2px;
    }
    .demo-controls {
      background: white;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow-sm);
    }
    /* 시연 화면 placeholder (사번 불러오기 전) */
    .demo-placeholder {
      text-align: center;
      padding: 60px 20px;
      color: var(--color-text-muted);
      font-size: 13px;
      background: white;
      border: 2px dashed var(--color-border);
      border-radius: var(--radius);
      margin-bottom: 60px;
      line-height: 1.7;
    }
    /* 시연 화면과 컨트롤 사이 구분 */
    .demo-spacer-bottom {
      text-align: center;
      font-size: 11px;
      color: var(--color-text-muted);
      letter-spacing: 2px;
      margin: 60px 0 16px;
      padding-top: 16px;
      border-top: 1px dashed var(--color-border);
    }
    .demo-controls h3 {
      font-size: 13px;
      color: var(--color-text-secondary);
      margin: 0 0 10px 0;
      letter-spacing: -0.2px;
    }
    .demo-empid-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .demo-empid-row input {
      flex: 1;
      padding: 10px 12px;
      border: 1.5px solid var(--color-border);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      letter-spacing: 2px;
    }
    .demo-empid-row button {
      padding: 10px 16px;
      background: var(--color-primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .demo-empid-row button:disabled {
      background: var(--color-text-muted);
      cursor: not-allowed;
    }
    .demo-time-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding: 8px 10px;
      background: var(--color-bg);
      border-radius: 8px;
    }
    .demo-time-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-secondary);
    }
    .demo-time-row input[type="time"] {
      padding: 6px 10px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      background: white;
    }
    .demo-time-hint {
      font-size: 11px;
      color: var(--color-text-muted);
      margin-left: auto;
    }
    .scenario-indicator {
      font-size: 12px;
      color: var(--color-primary);
      font-weight: 700;
      padding: 8px 10px;
      background: #FFF4EC;
      border: 1px dashed var(--color-primary);
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .milestone-banner {
      background: linear-gradient(135deg, #FF6600 0%, #FF9933 100%);
      color: white;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 16px auto 0;
      box-shadow: 0 6px 18px rgba(255, 102, 0, 0.4);
      animation: milestonePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
      letter-spacing: -0.3px;
    }
    .milestone-banner .milestone-sub {
      font-weight: 600;
      opacity: 0.85;
      font-size: 12px;
    }
    @keyframes milestonePop {
      0% { transform: scale(0.4) translateY(8px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .demo-scenarios {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .demo-scenario {
      padding: 8px 10px;
      border: 1.5px solid var(--color-border);
      border-radius: 8px;
      background: white;
      font-size: 12px;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      transition: all 0.15s;
      color: var(--color-text);
    }
    .demo-scenario.active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: white;
      font-weight: 700;
    }
    .demo-empinfo {
      font-size: 12px;
      color: var(--color-text-secondary);
      margin-top: 8px;
      padding: 6px 10px;
      background: var(--color-bg);
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="demo-banner">데모 모드 — 실제 출근 기록 저장 안 됨</div>

  <div class="checkin-page">

    <header class="checkin-header">
      <div class="brand">
        <span class="brand-dots">
          <span class="dot dot-1"></span>
          <span class="dot dot-2"></span>
          <span class="dot dot-3"></span>
        </span>
        <span class="brand-name">FP 모닝 브리핑</span>
      </div>
    </header>

    <main class="checkin-main">

      <!-- 시연 화면 placeholder (사번 불러오기 전) -->
      <div class="demo-placeholder" id="demoPlaceholder">
        아래 컨트롤에서 사번을 불러오면<br>여기 시연 화면이 나타납니다
      </div>

      <!-- 토큰 모드 동일 화면 (사번 로드 후 표시) -->
      <section id="tokenSection" class="screen" style="display:none;">
        <div class="greeting-block">
          <h1 class="greeting-name"><span id="tokenEmpName">홍길동</span> <span class="greeting-suffix">님</span></h1>
          <p class="greeting-empid" id="tokenEmpId">사번 0000000</p>
        </div>

        <div class="ai-greet-card">
          <span class="ai-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            오늘 한마디
          </span>
          <p class="ai-greet-text typing" id="tokenAiGreeting">&nbsp;</p>
        </div>

        <div class="progress-card" id="progressCard" style="display:none;">
          <div class="progress-header">
            <span class="progress-title">이번달 출근</span>
            <span class="progress-count"><span id="progressCurrent">0</span> / <span id="progressTotal">22</span></span>
          </div>
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progressBarFill" style="width:0%;"></div>
          </div>
          <div class="progress-next" id="progressNext">·</div>
        </div>

        <div class="streak-card" id="streakCard" style="display:none;">
          <div class="streak-icon" id="streakIcon">·</div>
          <div class="streak-body">
            <div class="streak-headline" id="streakHeadline">·</div>
            <div class="streak-sub" id="streakSub">·</div>
          </div>
        </div>

        <div class="weekly-card">
          <div class="weekly-header">
            <span class="weekly-title">이번 주 출근</span>
            <span class="weekly-count" id="weeklyCount">- / 5</span>
          </div>
          <div class="weekly-days" id="weeklyDays"></div>
        </div>

        <div class="event-grid event-grid-compact">
          <button class="event-btn event-primary" data-event="출근" onclick="demoEventCheckin('출근')">
            <svg class="event-icon-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            <span class="event-name">출근</span>
            <span class="event-state" id="state-출근">&nbsp;</span>
          </button>
          <button class="event-btn" data-event="귀소" onclick="demoEventCheckin('귀소')">
            <svg class="event-icon-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            <span class="event-name">귀소</span>
            <span class="event-state" id="state-귀소">&nbsp;</span>
          </button>
          <button class="event-btn" data-event="학습회" onclick="demoEventCheckin('학습회')">
            <svg class="event-icon-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            <span class="event-name">학습회</span>
            <span class="event-state" id="state-학습회">&nbsp;</span>
          </button>
          <button class="event-btn" data-event="퇴근" onclick="demoEventCheckin('퇴근')">
            <svg class="event-icon-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span class="event-name">퇴근</span>
            <span class="event-state" id="state-퇴근">&nbsp;</span>
          </button>
        </div>
      </section>

      <!-- 로딩 -->
      <section id="loadingSection" class="screen" style="display:none;">
        <div class="loading-card">
          <div class="spinner show"></div>
          <p>처리 중이에요…</p>
        </div>
      </section>

      <!-- 성공 결과 -->
      <section id="successSection" class="result">
        <div class="result-card">
          <div class="result-icon-circle">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
          <h2 class="result-message">출근 확인되었습니다</h2>
          <div class="result-time" id="resultTime">08:42</div>
          <div class="result-detail" id="resultDetail"></div>

          <!-- 마일스톤 배너 (시나리오 적용 시 발동) -->
          <div class="milestone-banner" id="milestoneBanner" style="display:none;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <span id="milestoneText">·</span>
            <span class="milestone-sub">달성</span>
          </div>

          <div class="ai-greet-card result-greet">
            <span class="ai-badge">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
              오늘 한마디
            </span>
            <p class="ai-greet-text typing" id="resultGreeting">&nbsp;</p>
          </div>

          <button class="btn btn-secondary btn-block" onclick="resetDemo()" style="margin-top:24px;">다시 시연하기</button>
        </div>
      </section>

      <!-- 시연 화면과 컨트롤 사이 구분 -->
      <div class="demo-spacer-bottom">↓ 시연 컨트롤</div>

      <!-- 데모 컨트롤 (아래로 이동) -->
      <div class="demo-controls">
        <h3>1) 시연할 사번 + 시각</h3>
        <div class="demo-empid-row">
          <input type="tel" id="demoEmpId" placeholder="0000000" maxlength="10" inputmode="numeric">
          <button id="demoLoadBtn" onclick="loadDemoEmp()">불러오기</button>
        </div>
        <div class="demo-time-row">
          <label class="demo-time-label">시연 시각</label>
          <input type="time" id="demoTime" value="08:32">
          <span class="demo-time-hint">불러오기 누를 때 적용</span>
        </div>
        <div class="demo-empinfo" id="demoEmpInfo" style="display:none;"></div>

        <h3 style="margin-top:14px;">2) 시나리오 강제 (출근 누를 때 적용)</h3>
        <div class="scenario-indicator" id="scenarioIndicator">시나리오: 그대로 (출근해도 마일스톤 없음)</div>
        <div class="demo-scenarios">
          <button class="demo-scenario active" data-sc="real" onclick="setScenario(this)">그대로 (진짜 상태)</button>
          <button class="demo-scenario" data-sc="month5" onclick="setScenario(this)">이번달 5일째 마일스톤</button>
          <button class="demo-scenario" data-sc="month10" onclick="setScenario(this)">이번달 10일째</button>
          <button class="demo-scenario" data-sc="month20huge" onclick="setScenario(this)">이번달 20일째 HUGE</button>
          <button class="demo-scenario" data-sc="streak3" onclick="setScenario(this)">연속 3일</button>
          <button class="demo-scenario" data-sc="streak7" onclick="setScenario(this)">연속 7일</button>
          <button class="demo-scenario" data-sc="streak30huge" onclick="setScenario(this)">연속 30일 HUGE</button>
          <button class="demo-scenario" data-sc="firstOfMonth" onclick="setScenario(this)">이번달 첫 출근</button>
          <button class="demo-scenario" data-sc="late" onclick="setScenario(this)">지각 (09:15)</button>
          <button class="demo-scenario" data-sc="newbie" onclick="setScenario(this)">신규 등록</button>
        </div>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script>window.__SKIP_AUTO_INIT = true;</script>
  <script src="js/config.js?v=4.4"></script>
  <script src="js/checkin.js?v=4.4"></script>
  <script src="js/checkin-demo.js?v=4.4"></script>
</body>
</html>
